*{box-sizing:border-box}html,body{margin:0;background:#000;color:#ededed;font-family:Geist,Inter,system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:300;overflow-x:hidden;-webkit-font-smoothing:antialiased}
#v{position:fixed;inset:0;direction:ltr;background:radial-gradient(ellipse at 50% 46%,#101012,#000 70%)}#v canvas{display:block;width:100%;height:100%;cursor:crosshair;touch-action:none}
.shade{position:fixed;inset:0;z-index:3;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.9) 0,rgba(0,0,0,.62) 24%,transparent 50%),linear-gradient(180deg,rgba(0,0,0,.75),transparent 22%),linear-gradient(0deg,rgba(0,0,0,.9),transparent 28%),linear-gradient(270deg,rgba(0,0,0,.65),transparent 17%)}
.ui{position:fixed;z-index:5;pointer-events:none}.ui button,.ui input,.ui label,.ui .tk div{pointer-events:auto}
.top{left:clamp(18px,3vw,44px);right:clamp(18px,3vw,44px);top:clamp(16px,2.6vw,34px);display:flex;justify-content:space-between;align-items:flex-start}
.top{z-index:80}.cm{position:relative;display:inline-block;pointer-events:auto;vertical-align:middle}
.cm button{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:14px;color:#fff;font-size:12px;letter-spacing:.28em;text-transform:uppercase;padding:4px 0}
.cm button svg{transition:transform .25s;opacity:.7}.cm.open button svg{transform:rotate(180deg)}
.cml{position:absolute;top:calc(100% + 10px);inset-inline-start:-14px;min-width:230px;padding:6px;border-radius:14px;background:rgba(14,14,16,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid #26262a;box-shadow:0 18px 50px rgba(0,0,0,.6);opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .2s,transform .2s;z-index:60}
.cm.open .cml{opacity:1;transform:none;pointer-events:auto}
.cml div{display:flex;flex-direction:column;gap:3px;padding:11px 14px;border-radius:9px;cursor:pointer;color:#c8c8cc;font-size:15px;letter-spacing:0;text-transform:none}
.cml div small{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#6d6d73}
.cml div:hover{background:#ffffff12;color:#fff}.cml div.on{color:#fff;background:#ffffff0a}
.cml div.on::after{content:'';position:absolute;inset-inline-end:16px;width:6px;height:6px;border-radius:50%;background:#fff;margin-top:9px}
.cm button{font-size:12px}.cm .cn{font-family:'Fraunces',Georgia,serif;font-weight:300;font-size:25px;letter-spacing:-.005em;text-transform:none;line-height:1}
.cm .cc{font-size:10.5px;letter-spacing:.24em;color:#8f8f94;text-transform:uppercase}
.cml div .cn2{font-family:'Fraunces',Georgia,serif;font-weight:300;font-size:23px;line-height:1.15}
.brand select{font:inherit;font-size:12px;letter-spacing:.28em;text-transform:uppercase;font-weight:400;color:#fff;background:transparent;border:0;border-bottom:1px solid #333338;padding:2px 22px 3px 0;margin-inline-end:4px;cursor:pointer;pointer-events:auto;appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' fill='none' stroke='white' stroke-width='1.3'/></svg>");background-repeat:no-repeat;background-position:right 2px center}.brand select option{background:#111;color:#fff;letter-spacing:0;text-transform:none}.brand{font-size:12px;letter-spacing:.28em;color:#8f8f94;text-transform:uppercase;font-weight:400}.brand b{color:#fff;font-weight:400}
.lang{display:flex;gap:2px;pointer-events:auto}.lang button{font:inherit;font-size:12px;font-weight:400;letter-spacing:.06em;background:none;border:0;color:#6d6d72;padding:4px 8px;cursor:pointer}.lang button.on{color:#fff}
.hero{left:clamp(18px,3vw,44px);top:clamp(104px,14vh,150px)}
.y{font-size:clamp(60px,9.5vw,140px);line-height:.9;font-weight:200;letter-spacing:-.045em;color:#fff;margin:0}
.sn{font-size:clamp(15px,1.3vw,19px);color:#8f8f94;margin:10px 0 0;min-height:20px;font-weight:300}
.stats{display:flex;gap:clamp(20px,3.2vw,52px);margin-top:clamp(18px,3.4vh,40px)}.stats div{min-width:0}
.stats b{display:block;font-size:clamp(26px,3.2vw,48px);font-weight:300;color:#fff;letter-spacing:-.02em;line-height:1.05;direction:ltr;unicode-bidi:isolate;white-space:nowrap}.stats span{display:block;font-size:clamp(14px,1.2vw,17px);color:#8f8f94;margin-top:5px}
.green{margin-top:clamp(16px,3vh,34px)}.green b{display:block;font-size:clamp(44px,6vw,92px);font-weight:300;color:#74dd7c;letter-spacing:-.035em;line-height:.95;direction:ltr;unicode-bidi:isolate}.green span{display:block;font-size:clamp(12px,1vw,14px);color:#8f8f94;margin-top:6px}
.green em{direction:ltr;unicode-bidi:isolate;display:block;font-style:normal;font-size:clamp(13px,1.1vw,16px);color:#cfcfd3;margin-top:4px}.gb{display:flex;gap:1px;align-items:flex-end;height:38px;width:min(300px,60vw);margin-top:14px}.bar{flex:1;height:100%;display:flex;align-items:flex-end}.bar div{width:100%;background:#173324;border-radius:1px 1px 0 0}.bar.on div{background:#74dd7c}
.lg{right:clamp(18px,3vw,44px);top:clamp(64px,9vh,104px);display:flex;flex-direction:column;gap:9px;font-size:12px;color:#9a9aa0;align-items:flex-start}.lg span{display:flex;align-items:center;gap:9px;white-space:nowrap}.lg i{display:inline-block;width:12px;height:12px;flex:none}
.lg i.c{background:linear-gradient(90deg,#c8c8c8,#222)}.lg i.gn{background:#74dd7c}.lg i.nw{background:#fff}.lg i.ar{height:2px;width:12px;background:#fff}.lg i.wt{background:#2f86d8}.lg i.bg{background:#6b5c45}.lg i.kd1{background:#a56bff;border-radius:4px}
.acts{left:clamp(18px,3vw,44px);bottom:clamp(86px,13vh,120px);display:flex;gap:10px}
.pill{font:inherit;font-size:12px;font-weight:400;letter-spacing:.14em;text-transform:uppercase;background:rgba(0,0,0,.35);color:#e6e6e8;border:1px solid #333338;border-radius:999px;padding:11px 18px;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}.pill:hover{border-color:#8a8a90}.pill.on{background:#fff;color:#000;border-color:#fff}.pill.solid{background:#fff;color:#000;border-color:#fff}
#gm{font-size:12px;color:#9a9aa0;margin-inline-start:4px;align-self:center;max-width:260px;pointer-events:none}
.bottom{left:clamp(18px,3vw,44px);right:clamp(18px,3vw,44px);bottom:clamp(14px,2.6vh,30px);display:flex;align-items:center;gap:clamp(12px,2vw,24px)}
.pb{width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:#000;font-size:13px;cursor:pointer;flex:none}
.trk{position:relative;flex:1;height:56px}
.trk input{-webkit-appearance:none;appearance:none;position:absolute;left:0;right:0;top:0;width:100%;height:30px;margin:0;background:transparent;cursor:pointer}
.trk input::-webkit-slider-runnable-track{height:2px;background:linear-gradient(90deg,#fff var(--p,0%),#2a2a2e var(--p,0%))}.trk input::-moz-range-track{background:#2a2a2e;height:2px}.trk input::-moz-range-progress{background:#fff;height:2px}
.trk input::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#000;border:2px solid #fff;margin-top:-10px}.trk input::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#000;border:2px solid #fff}
.tk{position:absolute;left:11px;right:11px;top:26px;height:24px;direction:ltr}.tk div{position:absolute;transform:translateX(-50%);font-size:12px;color:#6d6d72;cursor:pointer;padding:0 2px}.tk div:before{content:"";display:block;width:1px;height:6px;background:#38383c;margin:0 auto 4px}.tk div.on{color:#fff}
.rt{font-size:12px;color:#6d6d72;flex:none;display:flex;gap:6px;align-items:center;cursor:pointer}
#tip{position:fixed;z-index:7;display:none;pointer-events:none;color:#fff;padding:10px 14px;font-size:13px;line-height:1.45;max-width:260px;background:rgba(0,0,0,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-left:2px solid #fff}#tip b{display:block;font-weight:400;font-size:14px}#tip span{display:block;color:#a8a8ae}
